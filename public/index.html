<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⭐ 超级积分乐园</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-main: #0f0e17;
  --bg-card: #1a1930;
  --accent-orange: #ff8906;
  --accent-pink: #e53170;
  --accent-blue: #2cb1ff;
  --accent-green: #0eca5c;
  --accent-purple: #a855f7;
  --accent-yellow: #ffd700;
  --text-main: #fffffe;
  --text-sub: #a7a9be;
  --radius: 18px;
  --radius-sm: 12px;
  --nav-height: 64px;
}

body {
  font-family: 'Fredoka', 'Noto Sans SC', sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(var(--nav-height) + 20px);
}

body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(168,85,247,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(44,177,255,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(255,137,6,0.06) 0%, transparent 50%);
  animation: bgFloat 20s ease-in-out infinite;
  z-index: 0;
  pointer-events: none;
}

@keyframes bgFloat {
  0%, 100% { transform: translate(0,0); }
  33% { transform: translate(2%,-2%); }
  66% { transform: translate(-1%,1%); }
}

/* App container */
.app { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 16px; }

/* Pages */
.page { display: none; }
.page.active { display: block; animation: pageIn 0.3s ease-out; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Bottom nav */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: rgba(15,14,23,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 8px 16px;
  border-radius: 12px;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
  background: none;
  border: none;
  color: var(--text-sub);
  font-family: inherit;
  font-size: 0.65em;
  font-weight: 500;
}

.nav-item .nav-icon { font-size: 1.8em; line-height: 1; }
.nav-item.active { color: var(--accent-orange); }
.nav-item.active .nav-icon { transform: scale(1.1); }

/* ===== Header ===== */
.page-header {
  text-align: center;
  padding: 16px 0;
}

.page-header h1 {
  font-size: 1.6em;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.page-header .subtitle { color: var(--text-sub); font-size: 0.8em; margin-top: 4px; }

/* ===== Stats row ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.mini-stat {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  padding: 12px 6px;
  text-align: center;
}

.mini-stat .ms-icon { font-size: 1.2em; }
.mini-stat .ms-val { font-size: 1.3em; font-weight: 700; margin: 2px 0; }
.mini-stat .ms-label { font-size: 0.6em; color: var(--text-sub); }
.mini-stat:nth-child(1) .ms-val { color: var(--accent-orange); }
.mini-stat:nth-child(2) .ms-val { color: var(--accent-blue); }
.mini-stat:nth-child(3) .ms-val { color: var(--accent-pink); }
.mini-stat:nth-child(4) .ms-val { color: var(--accent-green); }

/* ===== Level bar ===== */
.level-bar {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.lb-badge {
  width: 46px; height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5em;
  background: linear-gradient(135deg, rgba(255,137,6,0.2), rgba(229,49,112,0.2));
  border: 2px solid rgba(255,137,6,0.3);
  flex-shrink: 0;
  animation: badgePulse 2s ease-in-out infinite;
}

@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,137,6,0.2); }
  50% { box-shadow: 0 0 15px 3px rgba(255,137,6,0.1); }
}

.lb-info { flex: 1; min-width: 0; }
.lb-info .lb-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.lb-info .lb-name { font-weight: 600; font-size: 0.95em; }
.lb-info .lb-next { font-size: 0.7em; color: var(--text-sub); }

.xp-track {
  height: 10px;
  background: rgba(255,255,255,0.06);
  border-radius: 5px;
  overflow: hidden;
}

.xp-fill {
  height: 100%;
  border-radius: 5px;
  background: linear-gradient(90deg, var(--accent-orange), var(--accent-pink), var(--accent-purple));
  background-size: 200% 100%;
  animation: xpShimmer 3s ease-in-out infinite;
  transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes xpShimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ===== Section title ===== */
.sec-title {
  font-size: 1em;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.sec-title span { font-size: 1.2em; }

/* ===== Task grid ===== */
.task-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.task-btn {
  background: rgba(255,255,255,0.03);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-sm);
  padding: 16px 10px;
  cursor: pointer;
  text-align: center;
  position: relative;
  overflow: hidden;
  color: var(--text-main);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  transition: all 0.2s;
}

.task-btn:active { transform: scale(0.94); background: rgba(255,255,255,0.06); }
.task-btn .task-emoji { font-size: 1.8em; display: block; margin-bottom: 6px; }
.task-btn .task-name { font-size: 0.8em; font-weight: 500; display: block; margin-bottom: 5px; }
.task-btn .task-points {
  display: inline-block;
  background: linear-gradient(135deg, var(--accent-orange), var(--accent-pink));
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 0.7em;
  font-weight: 600;
}

.task-btn.earned { animation: earnBounce 0.5s cubic-bezier(0.34,1.56,0.64,1); }

@keyframes earnBounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.12); }
  60% { transform: scale(0.96); }
  100% { transform: scale(1); }
}

/* ===== Today log ===== */
.card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}

.log-list { max-height: 300px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }

.log-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: rgba(255,255,255,0.02);
  border-radius: 10px;
  margin-bottom: 6px;
  animation: logSlide 0.3s ease-out;
  border: 1px solid rgba(255,255,255,0.04);
}

@keyframes logSlide {
  from { opacity: 0; transform: translateX(-16px); }
  to { opacity: 1; transform: translateX(0); }
}

.log-item .log-left { display: flex; align-items: center; gap: 10px; }
.log-item .log-emoji { font-size: 1.2em; }
.log-item .log-name { font-weight: 500; font-size: 0.85em; }
.log-item .log-time { color: var(--text-sub); font-size: 0.7em; }
.log-item .log-pts { font-weight: 700; color: var(--accent-orange); font-size: 0.9em; }

.log-empty { text-align: center; color: var(--text-sub); padding: 24px; font-size: 0.85em; }

/* ===== Calendar ===== */
.calendar-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.calendar-nav h3 { font-size: 1em; font-weight: 600; }

.cal-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-main);
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1em;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.cal-label {
  text-align: center;
  font-size: 0.7em;
  color: var(--text-sub);
  padding: 4px 0;
  font-weight: 600;
}

.cal-day {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.8em;
  background: rgba(255,255,255,0.02);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.cal-day.empty { cursor: default; background: transparent; }
.cal-day.today { border: 2px solid var(--accent-blue); }
.cal-day .day-num { font-weight: 600; line-height: 1; }
.cal-day .day-pts { font-size: 0.55em; margin-top: 1px; font-weight: 500; opacity: 0.9; }

.cal-day.pts-low { background: rgba(44,177,255,0.1); border-color: rgba(44,177,255,0.15); }
.cal-day.pts-mid { background: rgba(14,202,92,0.15); border-color: rgba(14,202,92,0.2); }
.cal-day.pts-high { background: rgba(255,137,6,0.2); border-color: rgba(255,137,6,0.25); }
.cal-day.pts-super {
  background: linear-gradient(135deg, rgba(255,137,6,0.25), rgba(229,49,112,0.25));
  border-color: rgba(255,137,6,0.35);
}

/* ===== Data page ===== */
.data-card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
}

.data-card h3 {
  font-size: 0.9em;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.bar-chart { display: flex; flex-direction: column; gap: 8px; }

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bar-label { width: 50px; font-size: 0.75em; color: var(--text-sub); text-align: right; flex-shrink: 0; }

.bar-track {
  flex: 1;
  height: 20px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 0.6s ease-out;
  min-width: 2px;
}

.bar-val { width: 40px; font-size: 0.75em; font-weight: 600; }

/* Top tasks */
.top-task-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.top-task-item:last-child { border-bottom: none; }
.top-task-item .tt-left { display: flex; align-items: center; gap: 10px; }
.top-task-item .tt-rank { font-size: 1.2em; width: 30px; text-align: center; }
.top-task-item .tt-name { font-size: 0.85em; font-weight: 500; }
.top-task-item .tt-count { font-size: 0.7em; color: var(--text-sub); }
.top-task-item .tt-pts { font-weight: 700; color: var(--accent-orange); font-size: 0.9em; }

/* Big number */
.big-nums {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}

.big-num {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
}

.big-num .bn-val { font-size: 2em; font-weight: 700; }
.big-num .bn-label { font-size: 0.7em; color: var(--text-sub); margin-top: 4px; }

/* ===== Settings page ===== */
.setting-group {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
}

.setting-group-title {
  font-size: 0.85em;
  font-weight: 600;
  padding: 14px 16px 10px;
  color: var(--text-sub);
}

.setting-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,0.04);
}

.setting-item .si-left { display: flex; align-items: center; gap: 12px; }
.setting-item .si-icon { font-size: 1.3em; }
.setting-item .si-name { font-size: 0.85em; font-weight: 500; }
.setting-item .si-desc { font-size: 0.7em; color: var(--text-sub); margin-top: 2px; }

/* Task list in settings */
.task-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.04);
}

.task-list-item .tl-left { display: flex; align-items: center; gap: 10px; }
.task-list-item .tl-emoji { font-size: 1.3em; }
.task-list-item .tl-name { font-size: 0.85em; font-weight: 500; }
.task-list-item .tl-pts { font-size: 0.75em; color: var(--accent-orange); }

.tl-del {
  background: rgba(229,49,112,0.15);
  border: none;
  color: var(--accent-pink);
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1em;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

/* Add task form in settings */
.add-form { padding: 16px; }

.emoji-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.emoji-opt {
  width: 34px; height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1em;
  background: rgba(255,255,255,0.04);
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
}

.emoji-opt.selected { border-color: var(--accent-purple); background: rgba(168,85,247,0.15); }

.form-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.form-input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.85em;
}

.form-input::placeholder { color: var(--text-sub); }
.form-input:focus { outline: none; border-color: var(--accent-purple); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  color: white;
  font-family: inherit;
  font-weight: 600;
  font-size: 0.85em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
}

.btn-danger {
  background: rgba(229,49,112,0.15);
  border: 1px solid rgba(229,49,112,0.3);
  border-radius: 10px;
  padding: 12px 20px;
  color: var(--accent-pink);
  font-family: inherit;
  font-weight: 600;
  font-size: 0.85em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
  margin-top: 8px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 380px;
  width: 90%;
  max-height: 70vh;
  overflow-y: auto;
  animation: modalIn 0.3s ease-out;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal h3 { margin-bottom: 14px; font-size: 1.1em; }

.modal-close {
  float: right;
  background: rgba(255,255,255,0.06);
  border: none;
  color: var(--text-sub);
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1em;
  font-family: inherit;
}

/* Confetti */
.confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }

.confetti-piece {
  position: absolute;
  animation: confettiFall 1.5s ease-out forwards;
}

@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(80vh) rotate(720deg) scale(0.3); }
}

/* Points popup */
.points-popup {
  position: fixed;
  pointer-events: none;
  font-size: 1.8em;
  font-weight: 700;
  color: var(--accent-yellow);
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
  z-index: 998;
  animation: pointsUp 1.2s ease-out forwards;
}

@keyframes pointsUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-100px) scale(1.4); }
}

/* Streak fire */
.streak-fire { display: inline-block; animation: fireWiggle 0.5s ease-in-out infinite alternate; }
@keyframes fireWiggle { from { transform: rotate(-3deg); } to { transform: rotate(3deg) scale(1.05); } }
</style>
</head>
<body>

<div class="confetti-container" id="confetti"></div>

<div class="app">
  <!-- ========== HOME PAGE ========== -->
  <div class="page active" id="page-home">
    <div class="page-header">
      <h1>⭐ 超级积分乐园 ⭐</h1>
      <div class="subtitle">每一份努力都值得被记录！</div>
    </div>

    <!-- Quick stats -->
    <div class="stats-row">
      <div class="mini-stat">
        <div class="ms-icon">🏆</div>
        <div class="ms-val" id="s_today">0</div>
        <div class="ms-label">今日</div>
      </div>
      <div class="mini-stat">
        <div class="ms-icon">📊</div>
        <div class="ms-val" id="s_week">0</div>
        <div class="ms-label">本周</div>
      </div>
      <div class="mini-stat">
        <div class="ms-icon">🌟</div>
        <div class="ms-val" id="s_total">0</div>
        <div class="ms-label">总计</div>
      </div>
      <div class="mini-stat">
        <div class="ms-icon"><span class="streak-fire">🔥</span></div>
        <div class="ms-val" id="s_streak">0</div>
        <div class="ms-label">连续</div>
      </div>
    </div>

    <!-- Level -->
    <div class="level-bar">
      <div class="lb-badge" id="lvBadge">🌱</div>
      <div class="lb-info">
        <div class="lb-top">
          <span class="lb-name" id="lvName">小萌新</span>
          <span class="lb-next" id="lvNext">下一级：小勇士</span>
        </div>
        <div class="xp-track">
          <div class="xp-fill" id="xpBar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Tasks -->
    <div class="sec-title"><span>🎯</span> 点击打卡</div>
    <div class="task-grid" id="taskGrid"></div>

    <!-- Today log -->
    <div class="card">
      <div class="sec-title"><span>📝</span> 今日记录</div>
      <div class="log-list" id="logList">
        <div class="log-empty">还没有记录哦，快去完成任务吧！💪</div>
      </div>
    </div>
  </div>

  <!-- ========== CALENDAR PAGE ========== -->
  <div class="page" id="page-calendar">
    <div class="page-header"><h1>📅 积分日历</h1></div>
    <div class="card">
      <div class="calendar-nav">
        <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
        <h3 id="calTitle"></h3>
        <button class="cal-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="calendar-grid" id="calGrid"></div>
    </div>

    <!-- Selected day log -->
    <div class="card" id="calDayCard" style="display:none">
      <div class="sec-title"><span>📋</span> <span id="calDayTitle">选中日期</span></div>
      <div class="log-list" id="calDayLog"></div>
    </div>
  </div>

  <!-- ========== DATA PAGE ========== -->
  <div class="page" id="page-data">
    <div class="page-header"><h1>📊 数据统计</h1></div>

    <div class="big-nums">
      <div class="big-num">
        <div class="bn-val" id="d_total" style="color:var(--accent-orange)">0</div>
        <div class="bn-label">累计总积分</div>
      </div>
      <div class="big-num">
        <div class="bn-val" id="d_days" style="color:var(--accent-blue)">0</div>
        <div class="bn-label">打卡天数</div>
      </div>
      <div class="big-num">
        <div class="bn-val" id="d_tasks" style="color:var(--accent-green)">0</div>
        <div class="bn-label">完成任务数</div>
      </div>
      <div class="big-num">
        <div class="bn-val" id="d_avg" style="color:var(--accent-purple)">0</div>
        <div class="bn-label">日均积分</div>
      </div>
    </div>

    <!-- Weekly chart -->
    <div class="data-card">
      <h3>📈 最近7天</h3>
      <div class="bar-chart" id="weekChart"></div>
    </div>

    <!-- Top tasks -->
    <div class="data-card">
      <h3>🏅 任务排行榜</h3>
      <div id="topTasks"></div>
    </div>
  </div>

  <!-- ========== SETTINGS PAGE ========== -->
  <div class="page" id="page-settings">
    <div class="page-header"><h1>⚙️ 设置</h1></div>

    <!-- Task management -->
    <div class="setting-group">
      <div class="setting-group-title">📋 任务管理</div>
      <div id="taskListSettings"></div>
      <div class="add-form">
        <div class="sec-title" style="font-size:0.85em"><span>➕</span> 添加新任务</div>
        <div class="emoji-picker" id="emojiPicker"></div>
        <div class="form-row">
          <input class="form-input" type="text" id="newTaskName" placeholder="任务名称" maxlength="20">
          <input class="form-input" type="number" id="newTaskPoints" placeholder="分数" min="1" max="100" style="max-width:70px">
        </div>
        <button class="btn-primary" onclick="addTask()">添加任务</button>
      </div>
    </div>

    <!-- Data management -->
    <div class="setting-group">
      <div class="setting-group-title">🗄️ 数据管理</div>
      <div style="padding:14px 16px">
        <button class="btn-primary" onclick="exportData()" style="margin-bottom:8px">📤 导出数据</button>
        <button class="btn-primary" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn-danger" onclick="clearAllData()">🗑️ 清除所有数据</button>
      </div>
    </div>
  </div>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchPage('home')">
    <span class="nav-icon">🏠</span>
    <span>首页</span>
  </div>
  <div class="nav-item" onclick="switchPage('calendar')">
    <span class="nav-icon">📅</span>
    <span>日历</span>
  </div>
  <div class="nav-item" onclick="switchPage('data')">
    <span class="nav-icon">📊</span>
    <span>数据</span>
  </div>
  <div class="nav-item" onclick="switchPage('settings')">
    <span class="nav-icon">⚙️</span>
    <span>设置</span>
  </div>
</div>

<!-- Day detail modal -->
<div class="modal-overlay" id="dayModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle"></h3>
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ===== Data =====
const API = window.location.origin + '/api';

const LEVELS = [
  { name: '小萌新', emoji: '🌱', min: 0 },
  { name: '小勇士', emoji: '⚔️', min: 50 },
  { name: '小达人', emoji: '🔥', min: 150 },
  { name: '小学霸', emoji: '🎓', min: 350 },
  { name: '超级英雄', emoji: '🦸', min: 600 },
  { name: '传奇大师', emoji: '👑', min: 1000 },
  { name: '宇宙之王', emoji: '🌌', min: 2000 },
];

const EMOJIS = ['📚','📖','🧹','🍳','🏃','🎹','✍️','🧮','🎨','🧪','💻','🌱','🎯','🧩','🔬','🎸','🏊','⚽','🧘','📝','🛏️','🦷','👕','🐕'];

let tasks = [], logs = {}, calMonth, calYear, selectedEmoji = '📚';

// ===== Init =====
async function init() {
  await loadData();
  const now = new Date();
  calMonth = now.getMonth();
  calYear = now.getFullYear();
  renderAll();
  setupEmojiPicker();
}

function getDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayKey() { return getDateKey(new Date()); }

async function loadData() {
  try {
    const [tasksRes, logsRes] = await Promise.all([
      fetch(API + '/tasks'),
      fetch(API + '/logs'),
    ]);
    tasks = await tasksRes.json();
    logs = await logsRes.json();
  } catch (e) {
    console.error('Failed to load data from server:', e);
    // Fallback to localStorage
    const s1 = localStorage.getItem('kp_tasks');
    tasks = s1 ? JSON.parse(s1) : [];
    const s2 = localStorage.getItem('kp_logs');
    logs = s2 ? JSON.parse(s2) : {};
  }
}

function renderAll() {
  renderTasks();
  renderLog();
  renderCalendar();
  renderData();
  renderTaskSettings();
  updateStats();
}

// ===== Navigation =====
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-item')[['home','calendar','data','settings'].indexOf(name)].classList.add('active');
  if (name === 'data') renderData();
  if (name === 'calendar') renderCalendar();
  if (name === 'settings') renderTaskSettings();
  window.scrollTo(0, 0);
}

// ===== Tasks =====
function renderTasks() {
  const todayLogs = logs[todayKey()] || [];
  const doneIds = new Set(todayLogs.map(l => l.taskId));
  document.getElementById('taskGrid').innerHTML = tasks.filter(t => !doneIds.has(t.id)).map(t => `
    <div class="task-btn" onclick="earnPoints(${t.id}, event)" data-id="${t.id}">
      <span class="task-emoji">${t.emoji}</span>
      <span class="task-name">${t.name}</span>
      <span class="task-points">+${t.points}分</span>
    </div>
  `).join('') || '<div class="log-empty">今天的任务都完成啦！🎉</div>';
}

function earnPoints(taskId, event) {
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;
  const key = todayKey();
  if (!logs[key]) logs[key] = [];
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  logs[key].push({ taskId: task.id, emoji: task.emoji, name: task.name, points: task.points, time });

  const btn = event.currentTarget;
  btn.classList.remove('earned');
  void btn.offsetWidth;
  btn.classList.add('earned');

  showPointsPopup(event, task.points);
  spawnConfetti();
  updateStats();
  renderLog();
  renderTasks();

  // Save to server in background (don't block UI)
  fetch(API + '/logs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date: key, taskId: task.id, emoji: task.emoji, name: task.name, points: task.points, time }),
  }).catch(e => console.error('Failed to save log:', e));
}

// ===== Stats =====
function updateStats() {
  const today = todayKey();
  const todayPts = (logs[today] || []).reduce((s, l) => s + l.points, 0);
  document.getElementById('s_today').textContent = todayPts;

  const now = new Date();
  const dow = now.getDay() || 7;
  let weekPts = 0;
  for (let i = 0; i < dow; i++) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    weekPts += (logs[getDateKey(d)] || []).reduce((s, l) => s + l.points, 0);
  }
  document.getElementById('s_week').textContent = weekPts;

  let totalPts = 0;
  for (const k in logs) totalPts += logs[k].reduce((s, l) => s + l.points, 0);
  document.getElementById('s_total').textContent = totalPts;

  let streak = 0;
  const d = new Date();
  while (logs[getDateKey(d)] && logs[getDateKey(d)].length > 0) { streak++; d.setDate(d.getDate()-1); }
  document.getElementById('s_streak').textContent = streak;

  // Level
  let cur = LEVELS[0], nxt = LEVELS[1];
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (totalPts >= LEVELS[i].min) { cur = LEVELS[i]; nxt = LEVELS[i+1] || null; break; }
  }
  document.getElementById('lvBadge').textContent = cur.emoji;
  document.getElementById('lvName').textContent = cur.name;
  if (nxt) {
    const pct = Math.min(100, ((totalPts - cur.min) / (nxt.min - cur.min)) * 100);
    document.getElementById('xpBar').style.width = pct + '%';
    document.getElementById('lvNext').textContent = `${totalPts - cur.min}/${nxt.min - cur.min} → ${nxt.name}`;
  } else {
    document.getElementById('xpBar').style.width = '100%';
    document.getElementById('lvNext').textContent = '🎉 已满级！';
  }
}

// ===== Log =====
function renderLog() {
  const key = todayKey();
  const list = document.getElementById('logList');
  const dayLogs = logs[key] || [];
  if (dayLogs.length === 0) {
    list.innerHTML = '<div class="log-empty">还没有记录哦，快去完成任务吧！💪</div>';
    return;
  }
  list.innerHTML = dayLogs.map((l, i) => `
    <div class="log-item">
      <div class="log-left">
        <span class="log-emoji">${l.emoji}</span>
        <div><div class="log-name">${l.name}</div><div class="log-time">${l.time}</div></div>
      </div>
      <span class="log-pts">+${l.points}</span>
    </div>
  `).join('');
}

// ===== Calendar =====
function changeMonth(d) {
  calMonth += d;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
  document.getElementById('calDayCard').style.display = 'none';
}

function renderCalendar() {
  const mNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('calTitle').textContent = `${calYear}年 ${mNames[calMonth]}`;

  const grid = document.getElementById('calGrid');
  const labels = ['一','二','三','四','五','六','日'];
  let html = labels.map(d => `<div class="cal-label">${d}</div>`).join('');

  let startDay = new Date(calYear, calMonth, 1).getDay() - 1;
  if (startDay < 0) startDay = 6;
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todayStr = todayKey();

  for (let i = 0; i < startDay; i++) html += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const pts = (logs[key] || []).reduce((s, l) => s + l.points, 0);
    let cls = '';
    if (pts > 0 && pts < 15) cls = 'pts-low';
    else if (pts >= 15 && pts < 30) cls = 'pts-mid';
    else if (pts >= 30 && pts < 50) cls = 'pts-high';
    else if (pts >= 50) cls = 'pts-super';
    const isToday = key === todayStr;

    html += `<div class="cal-day ${cls} ${isToday ? 'today' : ''}" onclick="showCalDay('${key}')">
      <span class="day-num">${d}</span>
      ${pts > 0 ? `<span class="day-pts">+${pts}</span>` : ''}
    </div>`;
  }
  grid.innerHTML = html;
}

function showCalDay(key) {
  const dayLogs = logs[key] || [];
  const card = document.getElementById('calDayCard');
  card.style.display = 'block';
  document.getElementById('calDayTitle').textContent = key;
  const container = document.getElementById('calDayLog');

  if (dayLogs.length === 0) {
    container.innerHTML = '<div class="log-empty">这天还没有记录</div>';
  } else {
    const total = dayLogs.reduce((s, l) => s + l.points, 0);
    container.innerHTML = dayLogs.map(l => `
      <div class="log-item">
        <div class="log-left">
          <span class="log-emoji">${l.emoji}</span>
          <div><div class="log-name">${l.name}</div><div class="log-time">${l.time}</div></div>
        </div>
        <span class="log-pts">+${l.points}</span>
      </div>
    `).join('') + `<div style="text-align:center;margin-top:12px;font-weight:700;color:var(--accent-orange)">总计 +${total} 分</div>`;
  }
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ===== Data =====
function renderData() {
  let totalPts = 0, totalTasks = 0, activeDays = 0;
  for (const k in logs) {
    if (logs[k].length > 0) { activeDays++; totalTasks += logs[k].length; }
    totalPts += logs[k].reduce((s, l) => s + l.points, 0);
  }
  document.getElementById('d_total').textContent = totalPts;
  document.getElementById('d_days').textContent = activeDays;
  document.getElementById('d_tasks').textContent = totalTasks;
  document.getElementById('d_avg').textContent = activeDays > 0 ? Math.round(totalPts / activeDays) : 0;

  // Weekly chart
  const weekDays = ['日','一','二','三','四','五','六'];
  const chart = document.getElementById('weekChart');
  let weekData = [];
  let maxPts = 1;
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = getDateKey(d);
    const pts = (logs[k] || []).reduce((s, l) => s + l.points, 0);
    weekData.push({ label: `周${weekDays[d.getDay()]}`, pts, date: k });
    if (pts > maxPts) maxPts = pts;
  }

  const colors = [
    'linear-gradient(90deg, var(--accent-blue), var(--accent-green))',
    'linear-gradient(90deg, var(--accent-orange), var(--accent-pink))',
    'linear-gradient(90deg, var(--accent-purple), var(--accent-blue))',
  ];

  chart.innerHTML = weekData.map((d, i) => {
    const w = Math.max(2, (d.pts / maxPts) * 100);
    return `<div class="bar-row">
      <div class="bar-label">${d.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${colors[i % 3]}"></div></div>
      <div class="bar-val" style="color:var(--accent-orange)">${d.pts}</div>
    </div>`;
  }).join('');

  // Top tasks
  const taskMap = {};
  for (const k in logs) {
    for (const l of logs[k]) {
      if (!taskMap[l.name]) taskMap[l.name] = { emoji: l.emoji, name: l.name, count: 0, pts: 0 };
      taskMap[l.name].count++;
      taskMap[l.name].pts += l.points;
    }
  }

  const sorted = Object.values(taskMap).sort((a, b) => b.pts - a.pts);
  const rankEmoji = ['🥇','🥈','🥉'];
  const topEl = document.getElementById('topTasks');

  if (sorted.length === 0) {
    topEl.innerHTML = '<div class="log-empty">还没有数据</div>';
  } else {
    topEl.innerHTML = sorted.slice(0, 8).map((t, i) => `
      <div class="top-task-item">
        <div class="tt-left">
          <span class="tt-rank">${rankEmoji[i] || (i+1)}</span>
          <div><div class="tt-name">${t.emoji} ${t.name}</div><div class="tt-count">完成 ${t.count} 次</div></div>
        </div>
        <span class="tt-pts">+${t.pts}</span>
      </div>
    `).join('');
  }
}

// ===== Settings =====
function renderTaskSettings() {
  document.getElementById('taskListSettings').innerHTML = tasks.map(t => `
    <div class="task-list-item">
      <div class="tl-left">
        <span class="tl-emoji">${t.emoji}</span>
        <div><div class="tl-name">${t.name}</div><div class="tl-pts">+${t.points}分</div></div>
      </div>
      <button class="tl-del" onclick="removeTask(${t.id})">✕</button>
    </div>
  `).join('');
}

async function removeTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  try { await fetch(API + '/tasks/' + id, { method: 'DELETE' }); } catch (e) { console.error(e); }
  renderTasks();
  renderTaskSettings();
}

async function addTask() {
  const name = document.getElementById('newTaskName').value.trim();
  const pts = parseInt(document.getElementById('newTaskPoints').value);
  if (!name || !pts || pts < 1) return;
  try {
    const res = await fetch(API + '/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ emoji: selectedEmoji, name, points: pts }),
    });
    const newTask = await res.json();
    tasks.push(newTask);
  } catch (e) { console.error(e); }
  renderTasks();
  renderTaskSettings();
  document.getElementById('newTaskName').value = '';
  document.getElementById('newTaskPoints').value = '';
}

function setupEmojiPicker() {
  document.getElementById('emojiPicker').innerHTML = EMOJIS.map(e =>
    `<div class="emoji-opt ${e === selectedEmoji ? 'selected' : ''}" onclick="pickEmoji('${e}',this)">${e}</div>`
  ).join('');
}

function pickEmoji(emoji, el) {
  selectedEmoji = emoji;
  document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

async function exportData() {
  try {
    const res = await fetch(API + '/export');
    const data = await res.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `积分乐园_${todayKey()}.json`;
    a.click();
  } catch (e) { console.error(e); alert('导出失败'); }
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      await fetch(API + '/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      await loadData();
      renderAll();
      alert('导入成功！');
    } catch { alert('文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

async function clearAllData() {
  if (confirm('确定要清除所有数据吗？此操作不可恢复！')) {
    try { await fetch(API + '/logs', { method: 'DELETE' }); } catch (e) { console.error(e); }
    logs = {};
    renderAll();
  }
}

function closeModal() { document.getElementById('dayModal').classList.remove('show'); }
document.getElementById('dayModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

// ===== Effects =====
function showPointsPopup(event, pts) {
  const popup = document.createElement('div');
  popup.className = 'points-popup';
  popup.textContent = `+${pts} ⭐`;
  const touch = event.touches ? event.touches[0] : event;
  popup.style.left = (touch.clientX || touch.pageX) + 'px';
  popup.style.top = (touch.clientY || touch.pageY) + 'px';
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1200);
}

function spawnConfetti() {
  const c = document.getElementById('confetti');
  const colors = ['#ff8906','#e53170','#2cb1ff','#0eca5c','#a855f7','#ffd700'];
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = '-10px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    p.style.width = (Math.random() * 8 + 4) + 'px';
    p.style.height = (Math.random() * 8 + 4) + 'px';
    p.style.animationDuration = (Math.random() * 1 + 1) + 's';
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    c.appendChild(p);
    setTimeout(() => p.remove(), 2000);
  }
}

init();
</script>
</body>
</html>
